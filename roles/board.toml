# The board: one column per step down and up the V. Roles pull from their
# column. This file is the only place WIP, polling and model tier per column
# are set. Tiers map to model names in manifest.json.
#
# An item's column is derived from its kind and state; nothing else moves it.
# wip: max items in progress in the column at once; 0 pauses the column. poll_seconds: how often
# the column's puller looks for work. tier: which model pulls here.

[columns.intent_new]        # Board writes an Intent and its validation
kinds = ["intent"]
states = ["waiting"]
role = "board"
tier = "human"
wip = 2
poll_seconds = 0            # humans are not polled

[columns.story_todo]        # Architect decomposes an Intent into Stories
kinds = ["intent"]
states = ["ready", "reopened"]
role = "architect"
tier = "frontier"
wip = 1
poll_seconds = 300

[columns.sheet_todo]        # Engineer cuts a Story into job pairs with sheets
kinds = ["story"]
states = ["waiting"]
labels_absent = ["cut"]     # leaves the column when the Engineer has cut it
role = "engineer"
tier = "engineer"
wip = 2
poll_seconds = 60
adapter = "opencode"

[columns.building]          # a cut Story whose pairs are being built; nobody pulls, everyone sees
kinds = ["story"]
states = ["ready"]
role = "none"
tier = "none"
wip = 99
poll_seconds = 0

[columns.build]             # Builder pulls one code job
kinds = ["code"]
states = ["ready", "reopened"]
role = "builder"
tier = "cheap"
wip = 4
poll_seconds = 30
adapter = "opencode"   # opencode free limit reached 2026-09-06; an item label harness:<name> overrides

[columns.test]              # Builder pulls one test job
kinds = ["test"]
states = ["ready", "reopened"]
role = "builder"
tier = "cheap"
wip = 4
poll_seconds = 30
adapter = "opencode"   # opencode free limit reached 2026-09-06; an item label harness:<name> overrides

[columns.prove]             # Supervisor gates a finished job, no model
kinds = ["code", "test"]
states = ["checking"]
role = "supervisor"
tier = "none"
wip = 8
poll_seconds = 15

[columns.verify]            # Architect ticks a Story checklist, and decides Analyst proposals
kinds = ["story", "proposal"]
states = ["checking", "reopened"]
role = "architect"
tier = "frontier"
wip = 2
poll_seconds = 300

[columns.validate]          # Board says yes or no
kinds = ["intent"]
states = ["checking"]
role = "board"
tier = "human"
wip = 3
poll_seconds = 0

[columns.triage]            # Analyst disposes of notes raised by any role or the Supervisor
kinds = ["note"]
states = ["waiting", "ready", "in_progress"]
labels_absent = ["triaged"] # leaves the column when the Analyst has disposed of it
role = "analyst"
tier = "analyst"
wip = 1
poll_seconds = 60
adapter = "opencode"

[columns.learn]             # Analyst reads the log for a Verified Story
kinds = ["story"]
states = ["done"]           # not in_progress: a Story mid-cut has no gate events to learn from,
                           # and listing it here took it out of the Engineer's column and
                           # held the Analyst's only slot. See note vm-pi7.5.1.
labels_absent = ["learned"] # leaves the column when the Analyst adds this label
role = "analyst"
tier = "analyst"
wip = 1
poll_seconds = 60
adapter = "opencode"

[columns.blocked]           # awaiting a person; nobody pulls, everyone sees. The note under a blocked item says who: its For line
kinds = ["intent", "story", "code", "test", "proposal"]
states = ["blocked"]
role = "none"
tier = "none"
wip = 99
poll_seconds = 0

[limits]
max_parallel_model_runs = 8   # across all columns, the hard spend cap: a backstop against
                              # runaway spend, not a scheduler. Set to the most pullers the
                              # Board intends to run at once (6 builders, 1 engineer,
                              # 1 analyst), since one puller is one model run at a time.
claim_timeout_seconds = 1800  # a claimed item nobody finished returns to its column
