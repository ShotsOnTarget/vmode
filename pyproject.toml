[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
include = ["src/**/*.py"]
extend-exclude = ["tools", "roles", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PLR", "SIM", "UP"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"src/**/test_*.py" = ["PLR", "C90"]
"src/conftest.py" = ["PLR", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 4
max-returns = 3
max-statements = 20
max-nested-blocks = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
