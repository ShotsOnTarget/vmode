[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PLR", "SIM", "UP"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"src/**/test_*.py" = ["PLR0913", "PLR0917", "PLR0915"]
"src/conftest.py" = ["PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 5
max-returns = 3
max-statements = 25
max-nested-blocks = 3

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
